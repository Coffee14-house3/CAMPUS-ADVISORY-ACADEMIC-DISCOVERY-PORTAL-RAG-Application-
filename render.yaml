services:
  - type: web
    name: hindustan-univ-rag-api
    runtime: node
    plan: free
    region: oregon # or singapore, frankfurt, ohio
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CHROMA_API_KEY
        sync: false
      - key: CHROMA_TENANT
        sync: false
      - key: CHROMA_DATABASE
        value: internship
